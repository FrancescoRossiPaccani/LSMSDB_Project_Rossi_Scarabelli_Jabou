spring.application.name=lsmsdb-project

# --- MONGODB (Replica Set) ---
spring.data.mongodb.uri=mongodb://localhost:27017,localhost:27018,localhost:27019/lsmsdb?replicaSet=rs0
spring.data.mongodb.auto-index-creation=true

# --- REDIS ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- NEO4J ---
